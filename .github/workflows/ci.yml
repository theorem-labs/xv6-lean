name: Lean build and proof audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Build all project modules
        run: |
          python3 tools/check_imports.py
          python3 tools/check_model.py
          python3 tools/lake.py build
          python3 tools/lake.py build +SailTest.ConcurrencyInterfaceV1Free
      - name: Audit proof assumptions
        run: |
          python3 tools/lake.py env lean Audit.lean
          python3 tools/lake.py env python3 tests/test_audit.py
      - name: Audit generated model and check instruction execution
        run: |
          python3 tools/lake.py env lean models/riscv/Tests/ModelAudit.lean
          python3 tools/lake.py env lean models/riscv/Tests/NormalizationProofs.lean
          python3 tools/lake.py env lean models/riscv/Tests/RootJal.lean
      - name: Check image decoding and importer rejection paths
        run: |
          python3 tools/lake.py env lean tests/Images.lean
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify reference provenance and generated files
        run: |
          python3 tools/upstream.py xv6iris
          python3 tools/inventory.py .upstream/xv6iris --check
          python3 tools/images.py .upstream/xv6iris --check
          python3 tools/kernel_maps.py .upstream/xv6iris --check --self-test
          python3 tools/inode_certificates.py .upstream/xv6iris --check --self-test
          python3 tools/bitmap_certificates.py .upstream/xv6iris --check --self-test
          python3 tools/directory_certificates.py .upstream/xv6iris --check --self-test
          python3 tools/user_files.py .upstream/xv6iris --check --self-test
